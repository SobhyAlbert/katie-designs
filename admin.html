<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — Katie Designs</title><meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=9">
<style>
.admin{max-width:760px;margin:0 auto}.admin form{display:grid;gap:14px}
.prog{height:12px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden}.prog>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1F3A93,#C9A227);transition:width .2s}
.msg{min-height:1.4em;font-weight:600}.msg.bad{color:#ff8a8a}.msg.good{color:#e6c75a}
.list{display:grid;gap:12px;margin-top:10px}.row{display:flex;gap:12px;align-items:center;padding:10px;border-radius:14px;background:rgba(3,10,31,.6);border:1px solid rgba(201,162,39,.2)}
.row img{width:64px;height:64px;object-fit:cover;border-radius:10px}.row .t{flex:1;min-width:0}.row .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chk{display:flex;gap:10px;align-items:center;min-height:48px}.chk input{width:22px;height:22px}
#preview{max-width:180px;border-radius:12px;display:none}
.warn{padding:14px;border-radius:14px;border:1px solid #C9A227;background:rgba(201,162,39,.1)}
</style></head><body>
<div id="bgstatic" aria-hidden="true" style="background-image:url(images/starry-night.jpg?v=9)"></div>
<header><nav class="nav" aria-label="Main"><a class="logo" href="index.html">Katie <span>Designs</span></a><ul><li><a class="l" href="index.html">← Back to site</a></li><li><button class="btn ghost" id="out" hidden>Sign out</button></li></ul></nav></header>
<main class="admin" id="main">
<section><h2>Studio admin</h2><p class="sub">Upload artworks. They appear on the site instantly.</p>
<div class="warn" id="notcfg" hidden><b>Firebase isn't configured yet.</b> Fill in <code>firebase-config.js</code>. See FIREBASE_SETUP.md.</div>

<form id="login" hidden novalidate><h3>Owner sign-in</h3>
<div><label for="le">Email</label><input id="le" type="email" autocomplete="username" required></div>
<div><label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password" required></div>
<button class="btn gold" type="submit">Sign in</button><p class="msg" id="lmsg" role="status"></p></form>

<form id="up" hidden novalidate><h3>Upload a new artwork</h3>
<div><label for="file">Image * (JPG/PNG/WebP; large images are resized to 2000px)</label><input id="file" type="file" accept="image/*" required><img id="preview" alt="Selected image preview"></div>
<div><label for="title">Title *</label><input id="title" required maxlength="120"></div>
<div><label for="cat">Category *</label><select id="cat" required><option value="portraits">Portraits</option><option value="landscapes">Landscapes</option><option value="sketches">Sketches</option><option value="digital">Digital</option><option value="painting">Painting</option></select></div>
<div><label for="price">Price (USD, 0 hides the Buy button)</label><input id="price" type="number" min="0" step="1" value="0" inputmode="numeric"></div>
<div><label for="checkout">Checkout link (Stripe Payment Link / Gumroad)</label><input id="checkout" type="url" placeholder="https://buy.stripe.com/..."></div>
<div><label for="desc">Short description</label><textarea id="desc" rows="3" maxlength="400"></textarea></div>
<label class="chk"><input id="isnew" type="checkbox"> Show in "New Works, Coming Soon"</label>
<div class="prog" aria-hidden="true"><i id="bar"></i></div>
<button class="btn gold" type="submit" id="go">Upload</button><p class="msg" id="umsg" role="status" aria-live="polite"></p></form>

<div id="manage" hidden><h3>Uploaded artworks</h3><div class="list" id="list"><p class="sub">Loading…</p></div></div>
</section></main>
<script type="module" src="admin.js?v=9"></script></body></html>
